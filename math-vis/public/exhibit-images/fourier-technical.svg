<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#10110f"/>
  <rect width="1200" height="700" fill="url(#scan)"/>

  <g transform="translate(205 55)">
    <rect width="790" height="590" fill="#151612" stroke="#f5f4eb" stroke-opacity=".35"/>

    <!-- Grid -->
    <g stroke="#f5f4eb" stroke-opacity=".10" stroke-width="1">
      <path d="M158 0V590M316 0V590M474 0V590M632 0V590"/>
      <path d="M0 118H790M0 236H790M0 354H790M0 472H790"/>
    </g>
    <!-- Axes -->
    <g stroke="#f5f4eb" stroke-opacity=".38" stroke-width="1.4">
      <path d="M0 295H790"/>
    </g>
    <!-- Divider: epicycles | waveform -->
    <line x1="316" y1="0" x2="316" y2="590" stroke="#f5f4eb" stroke-opacity=".22" stroke-width="1.2" stroke-dasharray="6 4"/>

    <!-- Epicycle 1 orbit (fundamental, r=128) -->
    <circle cx="180" cy="295" r="128" fill="none" stroke="#4499ff" stroke-width="1.8" stroke-opacity=".28"/>
    <!-- Epicycle 2 orbit (3rd harmonic, r=43) — centre at arm-1 tip -->
    <!-- Arm-1 tip at angle π/4: (180+128·0.707, 295−128·0.707) = (270.5, 204.5) -->
    <circle cx="271" cy="205" r="43" fill="none" stroke="#00ccff" stroke-width="1.4" stroke-opacity=".28"/>
    <!-- Epicycle 3 orbit (5th harmonic, r=26) — centre at arm-2 tip -->
    <!-- Arm-2 at angle 3π/4: (271−43·0.707, 205−43·0.707) = (240.6, 174.6) -->
    <circle cx="241" cy="175" r="26" fill="none" stroke="#00ffee" stroke-width="1.2" stroke-opacity=".28"/>

    <!-- Arm 1 (fundamental) -->
    <line x1="180" y1="295" x2="271" y2="205" stroke="#4499ff" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Arm 2 (3rd harmonic) -->
    <line x1="271" y1="205" x2="241" y2="175" stroke="#00ccff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Arm 3 (5th harmonic): angle 5π/4 → (241−26·0.707, 175+26·0.707) = (222.6, 193.4) -->
    <line x1="241" y1="175" x2="223" y2="193" stroke="#00ffee" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Tip dot -->
    <circle cx="223" cy="193" r="5" fill="#00ffee" filter="url(#glow)"/>

    <!-- Connector: tip → waveform leading edge (horizontal dashed) -->
    <line x1="223" y1="193" x2="316" y2="193" stroke="#f5f4eb" stroke-width="1.4" stroke-opacity=".36" stroke-dasharray="5 4"/>

    <!-- Waveform (3-harmonic square wave, period = 424 px) -->
    <!-- x range 316→740, amplitude ≈ 101 px, Gibbs peaks at ±111 px from centre -->
    <path d="M316,295
             C323,270 328,215 340,194
             C353,174 366,192 382,192
             C412,192 454,192 476,192
             C490,192 500,222 512,260
             C522,282 527,293 528,295
             C529,297 534,308 546,330
             C558,360 563,398 577,400
             C591,402 604,391 622,390
             C650,390 672,390 688,390
             C700,390 710,366 720,328
             C728,308 733,298 740,295"
      fill="none" stroke="#7dd3fc" stroke-width="3.4" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Fundamental component only (faint sine) -->
    <path d="M316,295 C350,205 380,192 422,192 C464,192 494,205 528,295 C562,385 592,398 634,398 C676,398 706,385 740,295"
      fill="none" stroke="#4499ff" stroke-width="1.6" stroke-opacity=".36" stroke-linecap="round"/>

    <!-- Axis labels -->
    <g fill="#f5f4eb" fill-opacity=".40" font-family="Arial, Helvetica, sans-serif" font-size="14">
      <text x="776" y="316">t</text>
      <text x="322" y="18">f(t)</text>
    </g>

    <!-- Harmonic labels -->
    <text x="142" y="195" fill="#4499ff" fill-opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="13">A₁</text>
    <text x="255" y="158" fill="#00ccff" fill-opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="13">A₃</text>
    <text x="220" y="162" fill="#00ffee" fill-opacity=".72" font-family="Arial, Helvetica, sans-serif" font-size="12">A₅</text>

    <!-- Axis tick marks -->
    <g stroke="#f5f4eb" stroke-opacity=".32" stroke-width="1">
      <path d="M311 295h10M311 193h10M311 397h10"/>
      <path d="M528 290v10M740 290v10"/>
    </g>
    <g fill="#f5f4eb" fill-opacity=".36" font-family="Arial, Helvetica, sans-serif" font-size="11">
      <text x="298" y="200">+1</text>
      <text x="298" y="400">−1</text>
      <text x="520" y="286">π</text>
      <text x="730" y="286">2π</text>
    </g>
  </g>

  <g fill="#f5f4eb" fill-opacity=".52" font-family="Arial, Helvetica, sans-serif" font-size="16">
    <text x="206" y="34">Fourier series · f(t) = Σ Aₙ sin(nωt)</text>
    <text x="855" y="668">epicycle decomposition</text>
  </g>
</svg>
